#:schema https://github.com/YunoHost/apps/raw/main/schemas/config_panel.v1.schema.json

## Grant/revoke identities and delegations straight from the webadmin,
## without SSH - see scripts/config for the real logic (custom
## getters/setters/actions; every change here writes directly to
## identity.toml / revoked_delegations.toml under $data_dir).
##
## All of it takes effect immediately: yunohost-mcp reloads both files on
## every request rather than only at startup, so nothing here restarts the
## service.

version = "1.0"

[access]
name.en = "Agent access"
name.fr = "Accès des agents"
services = []

    [access.overview]
    name.en = "Current identities"
    name.fr = "Identités actuelles"

        [access.overview.identities_summary]
        ask.en = "Granted identities"
        ask.fr = "Identités accordées"
        type = "alert"
        style = "info"
        # Filled dynamically by get__identities_summary in scripts/config.

    [access.edit]
    name.en = "Edit an existing identity"
    name.fr = "Modifier une identité existante"
    help.en = "Changes an existing identity.toml entry in place - no need to revoke and re-grant to change a role, name, or expiry. Effective immediately, no restart needed. Leave a field blank (or 'keep current' for role) to leave it unchanged; for expiry, type 'clear' to remove an existing expiry."
    help.fr = "Modifie une entrée identity.toml existante sur place - inutile de révoquer puis ré-accorder pour changer un rôle, un nom ou une expiration. Effectif immédiatement, aucun redémarrage requis. Laissez un champ vide (ou « keep current » pour le rôle) pour le laisser inchangé ; pour l'expiration, tapez « clear » pour la supprimer."

        [access.edit.edit_npub]
        ask.en = "Agent's npub to edit"
        ask.fr = "npub de l'agent à modifier"
        type = "string"
        optional = true
        bind = "null"
        example = "npub1sn0wdenkukak0d9dfczzeacvhkrgz92ak56egt7vdgzn8pv2wfqqhrjdv9"
        pattern.regexp = '^$|^npub1[a-z0-9]{20,}$'
        pattern.error = "Must be a valid npub1... Nostr public key"

        [access.edit.edit_name]
        ask.en = "New display name (leave blank to keep current)"
        ask.fr = "Nouveau nom affiché (laisser vide pour conserver l'actuel)"
        type = "string"
        optional = true
        bind = "null"

        [access.edit.edit_role]
        ask.en = "New role"
        ask.fr = "Nouveau rôle"
        type = "select"
        choices = ["(keep current)", "readonly", "operator", "app-admin", "package-developer", "administrator"]
        default = "(keep current)"
        bind = "null"
        help.en = "See PLAN.md / src/yunohost_mcp/policy/roles.py upstream for exactly which scopes each role grants."

        [access.edit.edit_expires]
        ask.en = "New expiry (YYYY-MM-DD, 'clear' to remove, or blank to keep current)"
        ask.fr = "Nouvelle expiration (AAAA-MM-JJ, « clear » pour supprimer, ou vide pour conserver l'actuelle)"
        type = "string"
        optional = true
        bind = "null"
        pattern.regexp = '^$|^clear$|^\d{4}-\d{2}-\d{2}$'
        pattern.error = "Use YYYY-MM-DD, 'clear' to remove expiry, or leave blank to keep current"

        [access.edit.do_edit]
        ask.en = "Save changes"
        ask.fr = "Enregistrer les modifications"
        type = "button"
        style = "success"

    [access.grant]
    name.en = "Grant a new identity"
    name.fr = "Accorder une nouvelle identité"
    help.en = "Adds an entry to identity.toml. Effective immediately, no restart needed."
    help.fr = "Ajoute une entrée à identity.toml. Effectif immédiatement, aucun redémarrage requis."

        [access.grant.grant_npub]
        ask.en = "Agent's npub"
        ask.fr = "npub de l'agent"
        type = "string"
        optional = true
        bind = "null"
        example = "npub1sn0wdenkukak0d9dfczzeacvhkrgz92ak56egt7vdgzn8pv2wfqqhrjdv9"
        pattern.regexp = '^$|^npub1[a-z0-9]{20,}$'
        pattern.error = "Must be a valid npub1... Nostr public key"

        [access.grant.grant_name]
        ask.en = "Display name"
        ask.fr = "Nom affiché"
        type = "string"
        optional = true
        bind = "null"
        example = "Claude agent"

        [access.grant.grant_role]
        ask.en = "Role"
        ask.fr = "Rôle"
        type = "select"
        choices = ["readonly", "operator", "app-admin", "package-developer", "administrator"]
        default = "readonly"
        bind = "null"
        help.en = "See PLAN.md / src/yunohost_mcp/policy/roles.py upstream for exactly which scopes each role grants."

        [access.grant.grant_expires]
        ask.en = "Expires (optional, YYYY-MM-DD)"
        ask.fr = "Expire (optionnel, AAAA-MM-JJ)"
        type = "string"
        optional = true
        bind = "null"
        pattern.regexp = '^$|^\d{4}-\d{2}-\d{2}$'
        pattern.error = "Use YYYY-MM-DD, or leave empty for no expiry"

        [access.grant.do_grant]
        ask.en = "Grant access"
        ask.fr = "Accorder l'accès"
        type = "button"
        style = "success"

    [access.revoke]
    name.en = "Revoke an identity"
    name.fr = "Révoquer une identité"
    help.en = "Removes an entry from identity.toml by npub. Effective immediately. Refuses to remove the last remaining administrator - use SSH (see doc/ADMIN.md) if that's genuinely what you need."
    help.fr = "Supprime une entrée de identity.toml par npub. Effectif immédiatement. Refuse de supprimer le dernier administrateur restant - utilisez SSH (voir doc/ADMIN.md) si c'est réellement nécessaire."

        [access.revoke.revoke_npub]
        ask.en = "Agent's npub to revoke"
        ask.fr = "npub de l'agent à révoquer"
        type = "string"
        optional = true
        bind = "null"
        pattern.regexp = '^$|^npub1[a-z0-9]{20,}$'
        pattern.error = "Must be a valid npub1... Nostr public key"

        [access.revoke.do_revoke]
        ask.en = "Revoke access"
        ask.fr = "Révoquer l'accès"
        type = "button"
        style = "danger"

    [access.delegations]
    name.en = "Revoked delegations"
    name.fr = "Délégations révoquées"
    help.en = "Delegation event ids (PLAN.md Phase 11) blocked independently of the delegator's own identity.toml entry - use yunohost-mcp-delegate's printed 'Event id' to find one. Editing this list takes effect immediately."
    help.fr = "Identifiants d'événements de délégation (PLAN.md Phase 11) bloqués indépendamment de l'entrée identity.toml du délégant - utilisez le « Event id » affiché par yunohost-mcp-delegate. La modification de cette liste est effective immédiatement."

        [access.delegations.revoked_delegation_ids]
        ask.en = "Revoked delegation event ids"
        ask.fr = "Identifiants d'événements de délégation révoqués"
        type = "tags"
        bind = "null"
        pattern.regexp = '^[0-9a-f]{64}$'
        pattern.error = "Must be a 64-char hex event id"
