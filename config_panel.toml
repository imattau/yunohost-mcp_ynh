#:schema https://github.com/YunoHost/apps/raw/main/schemas/config_panel.v1.schema.json

## Grant/revoke identities and delegations straight from the webadmin,
## without SSH - see scripts/config for the real logic (custom
## getters/setters/actions; every change here writes directly to
## identity.toml / revoked_delegations.toml under $data_dir).
##
## All of it takes effect immediately: yunohost-mcp reloads both files on
## every request rather than only at startup, so nothing here restarts the
## service.

version = "1.0"

[integration]
name.en = "Local integrations"
name.fr = "Intégrations locales"
services = []

    [integration.polypack]
    name.en = "Polypack memory"
    name.fr = "Mémoire Polypack"
    help.en = "Optional integration with the separately installed Polypack MCP app. The endpoint remains loopback-only and is never exposed through Nginx."
    help.fr = "Intégration facultative avec l'application MCP Polypack installée séparément. Le point de terminaison reste limité à la boucle locale et n'est jamais exposé par Nginx."

        [integration.polypack.status]
        ask.en = "Current endpoint"
        ask.fr = "Point de terminaison actuel"
        type = "alert"
        style = "info"
        # Filled dynamically by get__polypack_status in scripts/config.

        [integration.polypack.do_refresh_polypack]
        ask.en = "Refresh Polypack endpoint"
        ask.fr = "Actualiser le point de terminaison Polypack"
        type = "button"
        style = "info"
        help.en = "Re-read Polypack's YunoHost-allocated port, persist the loopback MCP URL, and restart YunoHost MCP."
        help.fr = "Relit le port alloué par YunoHost à Polypack, enregistre l'URL MCP locale et redémarre YunoHost MCP."

[access]
name.en = "Agent access"
name.fr = "Accès des agents"
services = []

    [access.overview]
    name.en = "Current identities"
    name.fr = "Identités actuelles"

        [access.overview.identities_summary]
        ask.en = "Granted identities"
        ask.fr = "Identités accordées"
        type = "alert"
        style = "info"
        # Filled dynamically by get__identities_summary in scripts/config.

    [access.backend]
    name.en = "Authorization backend"
    name.fr = "Backend d'autorisation"
    help.en = "TOML is the compatibility default. Group-backed authorization requires the nostr_auth lookup service and the MCP service user to be in the nostr-auth-lookup group. Changing this restarts the MCP frontend and broker."
    help.fr = "TOML est la valeur par défaut de compatibilité. L'autorisation par groupes nécessite le service de recherche nostr_auth et que l'utilisateur MCP appartienne au groupe nostr-auth-lookup. Cette modification redémarre le frontend MCP et le broker."

        [access.backend.identity_backend]
        ask.en = "Identity authorization source"
        ask.fr = "Source d'autorisation des identités"
        type = "select"
        choices = ["toml", "yunohost_groups"]
        bind = "null"
        help.en = "yunohost_groups resolves the Nostr identity through nostr_auth, then maps dedicated YunoHost MCP groups to MCP scopes."
        help.fr = "yunohost_groups résout l'identité Nostr via nostr_auth, puis associe les groupes YunoHost MCP dédiés aux scopes MCP."

    [access.groups]
    name.en = "YunoHost group access"
    name.fr = "Accès par groupes YunoHost"
    help.en = "In yunohost_groups mode, select a YunoHost user and MCP role below. Saving replaces that user's membership in the dedicated MCP role groups, so the selected role becomes effective for the Nostr identity linked to that account. These controls are inactive in TOML mode."
    help.fr = "En mode yunohost_groups, sélectionnez ci-dessous un utilisateur YunoHost et un rôle MCP. L'enregistrement remplace l'appartenance de cet utilisateur aux groupes de rôles MCP dédiés ; le rôle sélectionné devient effectif pour l'identité Nostr liée à ce compte. Ces contrôles sont inactifs en mode TOML."

        [access.groups.group_user]
        ask.en = "YunoHost user"
        ask.fr = "Utilisateur YunoHost"
        type = "select"
        optional = true
        bind = "null"
        choices = { placeholder = "(loading YunoHost users...)" }

        [access.groups.group_role]
        ask.en = "MCP role"
        ask.fr = "Rôle MCP"
        type = "select"
        choices = ["readonly", "operator", "app-admin", "package-developer", "administrator"]
        default = "readonly"
        bind = "null"

        [access.groups.do_group_assign]
        ask.en = "Set user's MCP role"
        ask.fr = "Définir le rôle MCP de l'utilisateur"
        type = "button"
        style = "success"

        [access.groups.do_group_remove]
        ask.en = "Remove user's MCP access"
        ask.fr = "Supprimer l'accès MCP de l'utilisateur"
        type = "button"
        style = "danger"

        [access.groups.group_assignments]
        ask.en = "Current MCP group memberships"
        ask.fr = "Appartenances actuelles aux groupes MCP"
        type = "alert"
        style = "info"
        # Filled dynamically by get__group_assignments in scripts/config.

    [access.edit]
    name.en = "Edit an existing identity"
    name.fr = "Modifier une identité existante"
    help.en = "TOML mode only. Changes an existing identity.toml entry in place - no need to revoke and re-grant to change a role, name, or expiry. In yunohost_groups mode, use YunoHost group access above instead."
    help.fr = "Mode TOML uniquement. Modifie une entrée identity.toml existante sur place - inutile de révoquer puis ré-accorder pour changer un rôle, un nom ou une expiration. En mode yunohost_groups, utilisez plutôt l'accès par groupes YunoHost ci-dessus."

        [access.edit.edit_npub]
        ask.en = "Agent to edit"
        ask.fr = "Agent à modifier"
        type = "select"
        optional = true
        bind = "null"
        choices = { placeholder = "(loading current identities...)" }
        # The real choices (npub -> "name (roles) — npub") are filled
        # dynamically by get__edit_npub in scripts/config, from whatever
        # identity.toml currently holds - no need to remember or
        # copy-paste an exact npub.

        [access.edit.edit_name]
        ask.en = "New display name (leave blank to keep current)"
        ask.fr = "Nouveau nom affiché (laisser vide pour conserver l'actuel)"
        type = "string"
        optional = true
        bind = "null"

        [access.edit.edit_role]
        ask.en = "New role"
        ask.fr = "Nouveau rôle"
        type = "select"
        choices = ["(keep current)", "readonly", "operator", "app-admin", "package-developer", "administrator"]
        default = "(keep current)"
        bind = "null"
        help.en = "See PLAN.md / src/yunohost_mcp/policy/roles.py upstream for exactly which scopes each role grants."

        [access.edit.edit_expires]
        ask.en = "New expiry (YYYY-MM-DD, 'clear' to remove, or blank to keep current)"
        ask.fr = "Nouvelle expiration (AAAA-MM-JJ, « clear » pour supprimer, ou vide pour conserver l'actuelle)"
        type = "string"
        optional = true
        bind = "null"
        pattern.regexp = '^$|^clear$|^\d{4}-\d{2}-\d{2}$'
        pattern.error = "Use YYYY-MM-DD, 'clear' to remove expiry, or leave blank to keep current"

        [access.edit.do_edit]
        ask.en = "Save changes"
        ask.fr = "Enregistrer les modifications"
        type = "button"
        style = "success"

    [access.grant]
    name.en = "Grant a new identity"
    name.fr = "Accorder une nouvelle identité"
    help.en = "TOML mode only. Adds an entry to identity.toml. In yunohost_groups mode, link the Nostr identity to a YunoHost user and assign that user's MCP role in YunoHost group access above."
    help.fr = "Mode TOML uniquement. Ajoute une entrée à identity.toml. En mode yunohost_groups, liez l'identité Nostr à un utilisateur YunoHost et attribuez son rôle MCP dans l'accès par groupes ci-dessus."

        [access.grant.grant_npub]
        ask.en = "Agent's npub"
        ask.fr = "npub de l'agent"
        type = "string"
        optional = true
        bind = "null"
        example = "npub1sn0wdenkukak0d9dfczzeacvhkrgz92ak56egt7vdgzn8pv2wfqqhrjdv9"
        pattern.regexp = '^$|^npub1[a-z0-9]{20,}$'
        pattern.error = "Must be a valid npub1... Nostr public key"

        [access.grant.grant_name]
        ask.en = "Display name"
        ask.fr = "Nom affiché"
        type = "string"
        optional = true
        bind = "null"
        example = "Claude agent"

        [access.grant.grant_role]
        ask.en = "Role"
        ask.fr = "Rôle"
        type = "select"
        choices = ["readonly", "operator", "app-admin", "package-developer", "administrator"]
        default = "readonly"
        bind = "null"
        help.en = "See PLAN.md / src/yunohost_mcp/policy/roles.py upstream for exactly which scopes each role grants."

        [access.grant.grant_expires]
        ask.en = "Expires (optional, YYYY-MM-DD)"
        ask.fr = "Expire (optionnel, AAAA-MM-JJ)"
        type = "string"
        optional = true
        bind = "null"
        pattern.regexp = '^$|^\d{4}-\d{2}-\d{2}$'
        pattern.error = "Use YYYY-MM-DD, or leave empty for no expiry"

        [access.grant.do_grant]
        ask.en = "Grant access"
        ask.fr = "Accorder l'accès"
        type = "button"
        style = "success"

    [access.revoke]
    name.en = "Revoke an identity"
    name.fr = "Révoquer une identité"
    help.en = "TOML mode only. Removes an entry from identity.toml by npub. In yunohost_groups mode, remove the user's MCP role from YunoHost group access above."
    help.fr = "Mode TOML uniquement. Supprime une entrée de identity.toml par npub. En mode yunohost_groups, supprimez le rôle MCP de l'utilisateur dans l'accès par groupes YunoHost ci-dessus."

        [access.revoke.revoke_npub]
        ask.en = "Agent to revoke"
        ask.fr = "Agent à révoquer"
        type = "select"
        optional = true
        bind = "null"
        choices = { placeholder = "(loading current identities...)" }
        # Filled dynamically by get__revoke_npub in scripts/config, same
        # as edit_npub above.

        [access.revoke.do_revoke]
        ask.en = "Revoke access"
        ask.fr = "Révoquer l'accès"
        type = "button"
        style = "danger"

    [access.delegations]
    name.en = "Revoked delegations"
    name.fr = "Délégations révoquées"
    help.en = "Delegation event ids (PLAN.md Phase 11) blocked independently of the delegator's own identity.toml entry - use yunohost-mcp-delegate's printed 'Event id' to find one. Editing this list takes effect immediately."
    help.fr = "Identifiants d'événements de délégation (PLAN.md Phase 11) bloqués indépendamment de l'entrée identity.toml du délégant - utilisez le « Event id » affiché par yunohost-mcp-delegate. La modification de cette liste est effective immédiatement."

        [access.delegations.revoked_delegation_ids]
        ask.en = "Revoked delegation event ids"
        ask.fr = "Identifiants d'événements de délégation révoqués"
        type = "tags"
        bind = "null"
        pattern.regexp = '^[0-9a-f]{64}$'
        pattern.error = "Must be a 64-char hex event id"

[owner]
name.en = "Owner approval"
name.fr = "Approbation du propriétaire"
services = []

    [owner.status]
    name.en = "Signer status"
    name.fr = "État du signataire"

        [owner.status.pairing_status]
        ask.en = "NIP-46 signer"
        ask.fr = "Signataire NIP-46"
        type = "alert"
        style = "info"
        # Filled dynamically by get__pairing_status in scripts/config.

        [owner.status.do_resync_relays]
        ask.en = "Refresh relay list"
        ask.fr = "Actualiser la liste de relais"
        type = "button"
        style = "info"
        help.en = "Not paired yet? The code above was generated once and reused since - if you've since published a relay list (or just want to retry a lookup that may have timed out), click this to look it up again and get a fresh code that uses it. Already paired? Nothing to do here."
        help.fr = "Pas encore associé ? Le code ci-dessus a été généré une fois puis réutilisé depuis - si vous avez publié une liste de relais depuis (ou souhaitez simplement relancer une recherche qui a pu expirer), cliquez ici pour la rechercher à nouveau et obtenir un nouveau code qui l'utilise. Déjà associé ? Rien à faire ici."

    [owner.pair]
    name.en = "Pair or re-pair your signer"
    name.fr = "Associer ou réassocier votre signataire"
    help.en = "The link/QR to scan is already shown above in Signer status - it's generated as soon as you open this panel, before clicking anything, and stays the same across reloads. Click below only once you've scanned it, to complete pairing against that exact code. Relays used: your own published relay list (looked up automatically from your npub) if found, otherwise a small set of sane defaults - either way, plus anything you list below (which also gets you a fresh code, since the one already shown was generated without it). Alternatively, if your signer app can export a bunker:// connection string itself (its own 'add a connection' feature, separate from scanning a code), paste it below instead - pairs immediately, no code involved."
    help.fr = "Le lien/QR à scanner est déjà affiché ci-dessus dans État du signataire - il est généré dès l'ouverture de ce panneau, avant tout clic, et reste identique après un rechargement. Cliquez ci-dessous seulement après l'avoir scanné, pour finaliser l'association avec ce code précis. Relais utilisés : votre propre liste de relais publiée (recherchée automatiquement à partir de votre npub) si trouvée, sinon un petit ensemble de valeurs par défaut raisonnables - dans les deux cas, en plus de ceux listés ci-dessous (ce qui génère aussi un nouveau code, celui déjà affiché ayant été généré sans ces relais). Autrement, si votre application signataire peut elle-même exporter une chaîne de connexion bunker:// (sa propre fonction « ajouter une connexion », distincte du scan d'un code), collez-la ci-dessous à la place - association immédiate, sans code."

        [owner.pair.pair_bunker_uri]
        ask.en = "Or paste a bunker:// URI from your signer app (optional)"
        ask.fr = "Ou collez une URI bunker:// depuis votre application signataire (facultatif)"
        type = "string"
        optional = true
        bind = "null"
        example = "bunker://a1b2c3...?relay=wss://relay.example&secret=..."

        [owner.pair.pair_extra_relays]
        ask.en = "Additional relays to also use (comma-separated, optional)"
        ask.fr = "Relais supplémentaires à utiliser également (séparés par des virgules, facultatif)"
        type = "string"
        optional = true
        bind = "null"
        example = "wss://relay.example.com, wss://another-relay.example"

        [owner.pair.do_pair]
        ask.en = "Pair signer"
        ask.fr = "Associer le signataire"
        type = "button"
        style = "success"

    [owner.approve]
    name.en = "Approve a pending operation"
    name.fr = "Approuver une opération en attente"
    help.en = "For a high-risk operation (system.upgrade, backup restore, ...) an agent told you is waiting on your approval. Paste the confirmation_id it gave you - this asks your paired signer to review and sign, same as running yunohost-mcp-approve yourself. Requires pairing first (see above)."
    help.fr = "Pour une opération à haut risque (system.upgrade, restauration de sauvegarde, ...) qu'un agent vous a signalée comme étant en attente de votre approbation. Collez le confirmation_id qu'il vous a communiqué - votre signataire associé sera invité à examiner et signer, comme si vous exécutiez vous-même yunohost-mcp-approve. Nécessite une association préalable (voir ci-dessus)."

        [owner.approve.approve_confirmation_id]
        ask.en = "confirmation_id"
        ask.fr = "confirmation_id"
        type = "string"
        optional = true
        bind = "null"
        example = "confirm-194760de45814a0fa65d"

        [owner.approve.do_approve]
        ask.en = "Approve"
        ask.fr = "Approuver"
        type = "button"
        style = "success"
