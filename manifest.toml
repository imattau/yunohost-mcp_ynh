#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "yunohost_mcp"
name = "YunoHost MCP"
description.en = "Nostr-authenticated MCP server for AI-assisted YunoHost administration and app-package development"
description.fr = "Serveur MCP authentifié par Nostr pour l'administration de YunoHost et le développement de paquets assistés par IA"

version = "0.8.28~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0-or-later"
admindoc = "https://github.com/imattau/yunohost-mcp/blob/master/PLAN.md"
code = "https://github.com/imattau/yunohost-mcp"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = false
sso = false
disk = "200M"
ram.build = "512M"
ram.runtime = "80M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin_npub]
    ask.en = "Your Nostr public key (npub) - granted the administrator role so you aren't locked out of your own server"
    ask.fr = "Votre clé publique Nostr (npub) - se verra attribuer le rôle administrateur pour que vous ne soyez pas exclu de votre propre serveur"
    type = "string"
    example = "npub1sn0wdenkukak0d9dfczzeacvhkrgz92ak56egt7vdgzn8pv2wfqqhrjdv9"
    pattern.regexp = "^npub1[a-z0-9]{20,}$"
    pattern.error = "Must be a valid npub (starting with npub1)"

    [install.pair_owner_signer_now]
    ask.en = "Pair your NIP-46 signer now for owner approvals? (recommended, optional - can be done later from the config panel). Have your signer app (Amber, nsec.app, ...) ready before continuing: this shows a one-time link during install and waits briefly for it to be opened."
    ask.fr = "Associer votre signataire NIP-46 dès maintenant pour les approbations du propriétaire ? (recommandé, facultatif - possible plus tard depuis le panneau de configuration). Ayez votre application signataire (Amber, nsec.app, ...) prête avant de continuer : un lien à usage unique s'affiche pendant l'installation et une brève attente d'ouverture suit."
    type = "boolean"
    default = true

[resources]
    [resources.sources.main]
    url = "https://github.com/imattau/yunohost-mcp/archive/refs/tags/v0.8.28.tar.gz"
    sha256 = "876dae3471ca13a49fe6a494f31435e8d527e6f0bc5af267c8ffa08b90a6e2e7"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions.main]
    url = "/"

    [resources.ports.main]
    default = 8765

    [resources.apt]
    packages = "python3-venv, python3-dev, build-essential, libffi-dev, pkg-config"
