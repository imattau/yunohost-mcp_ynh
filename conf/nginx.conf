location / {

  proxy_pass      http://127.0.0.1:__PORT__/;
  # NOT proxy_params (the SSOwat-auth-aware include): this app authenticates
  # its own callers via NIP-98 signed requests, not YunoHost user accounts -
  # proxy_params_no_auth passes the client's real Authorization header
  # through untouched instead of overwriting it with an SSOwat session.
  include         proxy_params_no_auth;
  proxy_redirect  off;

  client_max_body_size 4M;
}
